<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clicker Game</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
</head>
<body>

    <div class="scene">

        <model-viewer
            class="scene__model"
            src="Maquina-Arcade.glb"
            camera-controls
            disable-zoom
            auto-rotate
            auto-rotate-delay="0"
            rotation-per-second="12deg"
            camera-orbit="-35deg 78deg 3.2m"
            camera-target="0m 0.6m 0m"
            field-of-view="28deg"
            shadow-intensity="1"
            exposure="0.95"
            environment-image="neutral"
            interaction-prompt="none">
        </model-viewer>

        <main class="arcade">

            <header class="arcade__header">
                <span class="arcade__eyebrow">Sala de máquinas</span>
                <h1 class="arcade__title">Coin Clicker</h1>
            </header>

            <section class="stat-row">
                <div class="stat-card stat-card--multi">
                    <h2 class="stat-card__label">Multiplicador</h2>
                    <p class="stat-card__value" id="Multiplicador">1</p>
                </div>

                <div class="stat-card stat-card--precio">
                    <h2 class="stat-card__label">Precio de mejora</h2>
                    <p class="stat-card__value" id="Costo">:precio:</p>
                </div>
            </section>

            <section class="counter-display">
                <h2 class="counter-display__label">Puntos</h2>
                <p class="counter-display__value" id="contador">0</p>
            </section>

            <section class="controls">
                <button class="btn btn--primary" onclick="PlushFunction()">
                    Click Me
                </button>
                <button class="btn btn--upgrade" onclick="MultiFunc()">
                    Comprar <span class="btn__badge">1.5x profit</span>
                </button>
            </section>

        </main>

    </div>

    <script>
        let multi = 1, costo = 50, contador = 0;

        function init(){
            document.getElementById("Costo").textContent = costo;
        }
        window.addEventListener("DOMContentLoaded", init);

        function MultiFunc(){
            if(contador >= costo){
                contador = contador - costo;
                console.log("Contador", contador)
                document.getElementById("contador").textContent=contador;

                costo = Math.round(costo * 1.105);
                document.getElementById("Costo").textContent = costo;

                multi++;
                console.log("Multiplicador", multi)
                document.getElementById("Multiplicador").textContent=multi;
            } else{
                alert("Saldo insuficiente");
            }
        }

        function PlushFunction(){
            contador = contador + 1 * multi;
            console.log("Contador", contador);
            document.getElementById("contador").textContent = contador;
        }
    </script>

</body>
</html>
